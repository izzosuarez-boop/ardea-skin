# Ardea Skin: the store (web), its agent and Telegram bot (api), and Caddy in front with automatic HTTPS.
#   docker compose -f infra/docker-compose.yml up -d --build
# In production it runs next to the portfolio site it belongs to.
name: ardea-skin

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates: keep across rebuilds (Let's Encrypt rate limits)
      - caddy_config:/config
    env_file: ../.env # STORE_HOST and API_HOST for the Caddyfile
    depends_on:
      - web
      - api

  web:
    build:
      context: ../web
      args:
        # Dev-store password page in front of Shopify checkout, shown to visitors in the cart on purpose. Empty = hidden.
        NEXT_PUBLIC_STORE_PASSWORD: ""
    restart: unless-stopped
    env_file: ../.env # Shopify server-side tokens; read at runtime, never baked into the image
    expose:
      - "3000"

  api:
    build: ../api
    restart: unless-stopped
    env_file: ../.env
    expose:
      - "8000"

volumes:
  caddy_data:
  caddy_config:
